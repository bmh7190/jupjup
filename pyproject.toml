[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jupjup"
version = "0.1.0"
description = "경찰청 유실물 API 3종을 조회하고 습득물 후보를 추천하는 JupJup LangChain Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.1,<2",
  "langchain-openai>=1.0,<2",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "fastapi>=0.110,<1",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
]

[project.scripts]
jupjup = "jupjup.cli:main"
jupjup-web = "jupjup.web:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jupjup = ["web_assets/*.html"]

[tool.vercel]
entrypoint = "src.jupjup.web:app"
