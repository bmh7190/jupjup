[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lost112-agent"
version = "0.1.0"
description = "경찰청 유실물 API 3종을 조회하고 습득물 후보를 추천하는 LangChain Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.1,<2",
  "langchain-openai>=1.0,<2",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
lost112-agent = "lost112_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

