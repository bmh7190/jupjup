<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>줍줍이 채팅</title>
<style>
  :root {
    --bg: #f4f6fb;
    --panel: #ffffff;
    --border: #e2e6f0;
    --text: #1f2430;
    --muted: #6b7280;
    --brand: #4f46e5;
    --brand-weak: #eef0ff;
    --bubble-user: #4f46e5;
    --bubble-user-text: #ffffff;
    --bubble-bot: #ffffff;
    --score-track: #eef0f5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #d1d5db;
    display: inline-block;
  }
  #status-dot.ok { background: #22c55e; }
  #status-dot.error { background: #ef4444; }
  #status-text { font-size: 12px; color: var(--muted); }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .row { display: flex; gap: 10px; max-width: 760px; }
  .row.user { align-self: flex-end; flex-direction: row-reverse; }
  .row.bot { align-self: flex-start; }
  .avatar {
    flex-shrink: 0;
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    background: var(--brand-weak);
  }
  .row.user .avatar { background: #e0e7ff; }
  .bubble {
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .row.user .bubble { background: var(--bubble-user); color: var(--bubble-user-text); border-bottom-right-radius: 4px; }
  .row.bot .bubble { background: var(--bubble-bot); border: 1px solid var(--border); border-bottom-left-radius: 4px; }

  .panel {
    width: 100%;
    max-width: 760px;
    align-self: flex-start;
    margin-left: 42px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .panel h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip {
    font-size: 12px;
    background: var(--brand-weak);
    color: var(--brand);
    padding: 3px 10px;
    border-radius: 999px;
  }
  .status-line { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .status-line .err { color: #dc2626; margin-left: 8px; }

  .candidates { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .card {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: #fbfbfe;
    max-width: 260px;
  }
  .card .thumb {
    width: 100%;
    height: 160px;
    border-radius: 8px;
    background: #eef0f5 center/cover no-repeat;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
    font-size: 12px;
    overflow: hidden;
  }
  .card .thumb img { width: 100%; height: 100%; object-fit: contain; }
  .card .title-row { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  .card .title { font-weight: 600; font-size: 13px; }
  .card .score { font-weight: 700; font-size: 12px; color: var(--brand); white-space: nowrap; }
  .card .source-badge {
    font-size: 11px; color: var(--muted); background: #f0f1f6; padding: 2px 8px; border-radius: 999px;
    width: fit-content;
  }
  .card .meta { font-size: 12px; color: var(--muted); }
  .card .reasons { display: flex; flex-wrap: wrap; gap: 4px; }
  .card .reason {
    font-size: 11px; background: #ecfdf5; color: #047857; padding: 2px 8px; border-radius: 999px;
  }
  .card .links { display: flex; gap: 8px; margin-top: 2px; }
  .card .links a { font-size: 11px; color: var(--brand); text-decoration: none; }
  .card .links a:hover { text-decoration: underline; }

  .similar-list { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }

  .typing { font-size: 13px; color: var(--muted); font-style: italic; }

  footer {
    padding: 14px 20px 18px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
  }
  footer input {
    flex: 1;
    padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    font-size: 14px;
    outline: none;
  }
  footer input:focus { border-color: var(--brand); }
  footer button {
    padding: 0 18px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
    cursor: pointer;
  }
  #send-btn { background: var(--brand); color: #fff; font-weight: 600; }
  #send-btn:disabled { background: #c7c9f5; cursor: not-allowed; }
  #demo-btn { background: #f0f1f6; color: var(--text); }
  .empty-hint { color: var(--muted); font-size: 13px; text-align: center; margin-top: 40px; }

  .report { width: min(960px, 100%); align-self: center; background: white; border: 1px solid var(--border); border-radius: 16px; padding: 30px; }
  .report-top { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; border-bottom:1px solid var(--border); padding-bottom:22px; }
  .report-kicker { font-size:11px; letter-spacing:1.5px; color:var(--brand); font-weight:700; }
  .report h2 { font-size:22px; margin:8px 0; letter-spacing:-.6px; }
  .report p { font-size:13px; line-height:1.7; color:var(--muted); margin:0; }
  .report-badge { white-space:nowrap; padding:6px 10px; background:#f3f4f8; color:#646977; border-radius:6px; font-size:11px; }
  .report-layout { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(230px,1fr); gap:32px; padding-top:24px; }
  .report h3 { font-size:14px; margin:0 0 16px; }
  .report-fields { display:grid; grid-template-columns:1fr 1fr; margin:0; gap:0 24px; }
  .report-field { border-bottom:1px solid #edf0f5; padding:13px 0; min-width:0; }
  .report-field.wide { grid-column:1 / -1; }
  .report dt { font-size:11px; color:var(--muted); margin-bottom:7px; }
  .report dd { margin:0; font-size:14px; line-height:1.6; overflow-wrap:anywhere; }
  .report dd.missing { color:#9b721f; font-size:12px; }
  .report-aside { background:#f8f9fc; padding:20px; border-radius:8px; }
  .report-aside h3:not(:first-child) { margin-top:24px; }
  .report-list { margin:0; padding-left:18px; font-size:12px; line-height:1.8; color:#596174; }
  .report-list li + li { margin-top:6px; }
  .report-missing { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 14px; }
  .report-missing span { font-size:11px; background:#fff; border:1px solid #e5e7ee; padding:5px 8px; border-radius:4px; }
  .report-actions { display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding-top:24px; margin-top:24px; border-top:1px solid var(--border); }
  .report button,.report a { font:inherit; font-size:12px; cursor:pointer; border-radius:6px; padding:10px 14px; text-decoration:none; border:1px solid var(--border); background:white; color:var(--text); }
  .report .primary { background:var(--brand); color:white; border-color:var(--brand); }
  .report .text-link { border:0; color:var(--muted); }
  .report details { margin-top:20px; font-size:12px; color:var(--muted); }
  .report summary { cursor:pointer; padding:8px 0; }
  button:focus-visible,a:focus-visible,summary:focus-visible { outline:2px solid var(--brand); outline-offset:3px; }
  @media(max-width:680px) { main { padding:12px; } .report { padding:20px; } .report-layout { grid-template-columns:1fr; gap:24px; } .report-top { flex-direction:column; } .panel { margin-left:0; } footer { flex-wrap:wrap; padding:12px; } footer input { flex-basis:100%; } footer button { min-height:40px; } }
</style>
</head>
<body>
  <header>
    <h1>🔎 줍줍이 채팅</h1>
    <div style="display:flex; align-items:center; gap:6px;">
      <span id="status-dot"></span>
      <span id="status-text">연결 확인 중…</span>
    </div>
  </header>

  <main id="chat"></main>

  <footer>
    <input id="input" type="text" placeholder="예: 어제 저녁 강남역에서 검은색 카드지갑을 잃어버렸어" autocomplete="off" />
    <button id="demo-btn" type="button" title="API 키 없이 화면만 확인">데모 모드</button>
    <button id="send-btn" type="button">전송</button>
  </footer>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const demoBtn = document.getElementById('demo-btn');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');

let threadId = null;

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

// 모델이 답변에 넣는 아주 단순한 마크다운(**굵게**, - 목록)만 안전하게 HTML로 바꾼다.
function renderLiteMarkdown(text) {
  const escaped = text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
  return escaped
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/^- (.*)$/gm, '· $1');
}

function addMessage(role, text) {
  const row = el('div', 'row ' + (role === 'user' ? 'user' : 'bot'));
  row.appendChild(el('div', 'avatar', role === 'user' ? '🙂' : '🔎'));
  const bubble = el('div', 'bubble');
  if (role === 'user') {
    bubble.textContent = text;
  } else {
    bubble.innerHTML = renderLiteMarkdown(text);
  }
  row.appendChild(bubble);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return row;
}

function addTyping() {
  const row = el('div', 'row bot');
  row.id = 'typing-row';
  row.appendChild(el('div', 'avatar', '🔎'));
  row.appendChild(el('div', 'bubble typing', '생각하는 중…'));
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  const row = document.getElementById('typing-row');
  if (row) row.remove();
}

function fieldChips(query) {
  const labels = {
    item_name: '물품', category: '분류', color: '색상', brand: '브랜드',
    lost_date: '분실일', lost_time: '분실시각', lost_place: '장소', region: '지역',
  };
  const chips = [];
  for (const [key, label] of Object.entries(labels)) {
    const value = query && query[key];
    if (value) chips.push(`${label}: ${value}`);
  }
  if (query && query.features && query.features.length) {
    chips.push('특징: ' + query.features.join(', '));
  }
  return chips;
}


function renderReport(draft) {
  const section = el('section', 'report');
  section.setAttribute('aria-label', '분실신고서 초안');
  const top = el('div', 'report-top');
  const title = el('div');
  title.append(el('div', 'report-kicker', 'LOST ITEM REPORT'), el('h2', null, draft.title || '분실신고서 초안'), el('p', null, '입력한 내용을 정리했어요. 확인 후 경찰민원24에 옮겨 작성해 주세요.'));
  top.append(title, el('span', 'report-badge', '초안 · 제출 전'));
  section.append(top);
  const layout = el('div', 'report-layout');
  const documentPart = el('div');
  documentPart.append(el('h3', null, '01  분실 정보'));
  const fields = el('dl', 'report-fields');
  const entries = [['분실 물품',draft.item_name],['분류',draft.category],['분실 날짜',draft.lost_date],['분실 시간',draft.lost_time],['분실 장소',[draft.region,draft.lost_place].filter(Boolean).join(' '),true],['색상',draft.color],['브랜드',draft.brand],['크기',draft.size],['수량',draft.quantity == null ? null : draft.quantity+'개'],['식별 특징',(draft.features || []).join(', '),true],['분실 경위',draft.circumstances,true]];
  entries.forEach(([label,value,wide]) => {
    const item = el('div','report-field'+(wide?' wide':''));
    item.append(el('dt',null,label),el('dd',value?'':'missing',value || '확인 필요'));
    fields.append(item);
  });
  documentPart.append(fields); layout.append(documentPart);
  const aside = el('aside','report-aside');
  aside.append(el('h3',null,'02  작성 전 확인'));
  const essential = draft.missing_essential_fields || [];
  const recommended = draft.missing_recommended_fields || [];
  aside.append(el('p',null,essential.length ? '필수 정보 '+essential.length+'개를 먼저 확인해 주세요.' : (draft.ready_for_user_review ? '기본 정보가 준비됐어요. 내용을 검토해 주세요.' : '신고 가능 여부와 안내사항을 먼저 확인해 주세요.')));
  const missing = el('div','report-missing');
  essential.forEach(t=>missing.append(el('span',null,'필수 · '+t)));
  recommended.forEach(t=>missing.append(el('span',null,t)));
  aside.append(missing);
  if (draft.next_question) {
    const edit = el('button',null,'대화로 정보 보완하기'); edit.type='button';
    edit.onclick=()=>{ input.value='분실신고서 내용을 보완해서 다시 작성해줘. '; input.focus(); addMessage('bot',draft.next_question); };
    aside.append(edit);
  }
  if ((draft.improvement_tips || []).length) {
    aside.append(el('h3',null,'더 찾기 쉬운 신고서'));
    const tips = el('ul','report-list'); draft.improvement_tips.forEach(t=>tips.append(el('li',null,t))); aside.append(tips);
  }
  layout.append(aside); section.append(layout);
  const actions=el('div','report-actions');
  try {
    const url = new URL(draft.official_report_url);
    if (url.protocol === 'https:' && url.hostname === 'minwon24.police.go.kr') {
      const link = el('a', 'primary', '경찰민원24에서 작성 ↗');
      link.href = url.href; link.target = '_blank'; link.rel = 'noopener noreferrer';
      actions.append(link);
    }
  } catch {}
  section.append(actions);
  const notices=el('details'); notices.append(el('summary',null,'제출 전 안내사항'));
  const list=el('ul','report-list'); (draft.notices||[]).forEach(t=>list.append(el('li',null,t))); notices.append(list); section.append(notices);
  chat.append(section); section.scrollIntoView({block:'start',behavior:'smooth'});
}

function renderResult(searchResult) {
  const panel = el('div', 'panel');

  const chips = fieldChips(searchResult.query);
  if (chips.length) {
    const chipRow = el('div', 'chip-row');
    chips.forEach((c) => chipRow.appendChild(el('span', 'chip', c)));
    panel.appendChild(chipRow);
  }

  const counts = searchResult.source_counts || {};
  const errors = searchResult.errors || {};
  const countParts = Object.entries(counts).map(([src, n]) => `${src} ${n}건`);
  const statusLine = el('div', 'status-line');
  statusLine.textContent = countParts.length ? '조회 결과: ' + countParts.join(' · ') : '';
  Object.entries(errors).forEach(([src, msg]) => {
    const span = el('span', 'err', `${src} 조회 실패(${msg})`);
    statusLine.appendChild(span);
  });
  if (statusLine.textContent || Object.keys(errors).length) panel.appendChild(statusLine);

  panel.appendChild(el('h3', null, `추천 습득물 후보 (${(searchResult.candidates || []).length}건)`));

  const candidates = searchResult.candidates || [];
  if (!candidates.length) {
    panel.appendChild(el('div', 'status-line', '조건에 맞는 후보를 찾지 못했습니다.'));
  } else {
    const grid = el('div', 'candidates');
    candidates.forEach((c) => grid.appendChild(renderCard(c)));
    panel.appendChild(grid);
  }

  if (searchResult.similar_lost_reports && searchResult.similar_lost_reports.length) {
    panel.appendChild(el('h3', null, '유사한 기존 분실 신고'));
    const list = el('div', 'similar-list');
    searchResult.similar_lost_reports.forEach((r) => {
      list.appendChild(el('div', null, `- ${r.item_name || '이름 없음'} / ${r.event_date || '-'} / ${r.event_place || '-'}`));
    });
    panel.appendChild(list);
  }

  chat.appendChild(panel);
  chat.scrollTop = chat.scrollHeight;
}

function renderCard(candidate) {
  const record = candidate.record || {};
  const card = el('div', 'card');
  const confidenceLabels = { high: '높음', medium: '보통', low: '낮음' };
  const scopeLabels = {
    direct: '직접 장소', district: '같은 시군구', nearby: '인접 시군구',
    region: '같은 시도', adjacent: '인접 시도', nationwide: '전국',
    unrestricted: '위치 제한 없음'
  };

  const thumb = el('div', 'thumb');
  if (record.image_url) {
    const placeholder = el('span', null, '이미지를 불러올 수 없음');
    placeholder.style.display = 'none';
    const img = document.createElement('img');
    img.src = record.image_url;
    img.alt = record.item_name || '습득물 사진';
    img.onerror = () => { img.style.display = 'none'; placeholder.style.display = 'block'; };
    thumb.appendChild(img);
    thumb.appendChild(placeholder);
  } else {
    thumb.textContent = '등록된 사진 없음';
  }
  card.appendChild(thumb);

  const titleRow = el('div', 'title-row');
  titleRow.appendChild(el('span', 'title', record.item_name || '이름 없음'));
  titleRow.appendChild(el('span', 'score', `${candidate.score ?? '-'}점`));
  card.appendChild(titleRow);

  if (record.source) card.appendChild(el('span', 'source-badge', record.source));
  if (candidate.confidence || candidate.location_scope) {
    const confidence = confidenceLabels[candidate.confidence] || candidate.confidence || '-';
    const scope = scopeLabels[candidate.location_scope] || candidate.location_scope || '-';
    card.appendChild(el('div', 'meta', `신뢰도 ${confidence} · 검색 범위 ${scope}`));
  }
  card.appendChild(el('div', 'meta', `${record.event_date || '-'} · ${record.event_place || '-'}`));
  if (record.custody_place) card.appendChild(el('div', 'meta', '보관: ' + record.custody_place));

  if (candidate.reasons && candidate.reasons.length) {
    const reasons = el('div', 'reasons');
    candidate.reasons.forEach((reason) => reasons.appendChild(el('span', 'reason', reason)));
    card.appendChild(reasons);
  }

  const links = el('div', 'links');
  if (record.detail_url) {
    const a = document.createElement('a');
    a.href = record.detail_url; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = '상세 보기 →';
    links.appendChild(a);
  }
  if (links.childElementCount) card.appendChild(links);

  return card;
}

async function refreshStatus() {
  try {
    const res = await fetch('/api/status');
    const data = await res.json();
    if (data.ready) {
      statusDot.className = 'ok';
      statusText.textContent = '실제 Agent 연결됨';
    } else {
      statusDot.className = 'error';
      statusText.textContent = data.error ? ('연결 안 됨: ' + data.error) : '연결 안 됨 — 데모 모드를 사용하세요';
    }
  } catch (e) {
    statusDot.className = 'error';
    statusText.textContent = '서버 상태를 확인할 수 없습니다';
  }
}

async function send(endpoint, text) {
  if (text) addMessage('user', text);
  input.value = '';
  sendBtn.disabled = true; demoBtn.disabled = true;
  addTyping();
  try {
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text || '데모 모드로 화면 확인', thread_id: threadId }),
    });
    const data = await res.json();
    threadId = data.thread_id;
    removeTyping();
    if (data.response.report_draft) {
      renderReport(data.response.report_draft);
      if (data.response.search_result) renderResult(data.response.search_result);
    } else if (data.response.search_result) {
      // 검색 결과(카드 패널)가 있으면 모델이 만든 설명 텍스트는 생략하고
      // 카드 패널만 보여준다.
      renderResult(data.response.search_result);
    } else {
      addMessage('bot', data.response.message);
    }
  } catch (e) {
    removeTyping();
    addMessage('bot', '서버와 통신 중 오류가 발생했습니다: ' + e);
  } finally {
    sendBtn.disabled = false; demoBtn.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener('click', () => {
  const text = input.value.trim();
  if (!text) return;
  send('/api/chat', text);
});


demoBtn.addEventListener('click', () => {
  send('/api/demo', null);
});

// 한글/일본어 등 IME로 조합 중일 때 Enter를 누르면 조합이 끝나기 전에
// 전송돼서 마지막 글자가 입력창에 남는 문제가 있었다. 조합 중에는 무시한다.
let isComposing = false;
input.addEventListener('compositionstart', () => { isComposing = true; });
input.addEventListener('compositionend', () => { isComposing = false; });
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !isComposing && !e.isComposing) sendBtn.click();
});

addMessage('bot', '안녕하세요! 잃어버린 물건을 설명해주세요. 예: "어제 저녁 강남역에서 검은색 카드지갑을 잃어버렸어"\n(API 키 없이 화면만 보려면 "데모 모드" 버튼을 눌러보세요.)');
refreshStatus();
</script>
</body>
</html>
